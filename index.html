<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@200;300;400;500;700&display=swap" rel="stylesheet">

<script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    'text-primary': '#1d1d1f',
                    'text-secondary': '#86868b',
                    'apple-blue': '#0071e3',
                },
                fontFamily: {
                    'sans': ['IBM Plex Sans Arabic', 'sans-serif'],
                },
                animation: {
                    'blob': 'blob 20s infinite alternate',
                    'fade-up': 'fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    'scale-in': 'scaleIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                },
                keyframes: {
                    blob: {
                        '0%': { transform: 'translate(0, 0) scale(1)' },
                        '100%': { transform: 'translate(20px, -20px) scale(1.1)' },
                    },
                    fadeUp: {
                        '0%': { opacity: '0', transform: 'translateY(40px)' },
                        '100%': { opacity: '1', transform: 'translateY(0)' },
                    },
                    scaleIn: {
                        '0%': { opacity: '0', transform: 'scale(0.95)' },
                        '100%': { opacity: '1', transform: 'scale(1)' },
                    }
                }
            }
        }
    }
</script>
<style>
    body {
        background-color: #f5f5f7;
        color: #1d1d1f;
        overflow-x: hidden;
        font-weight: 400;
    }

    .mesh-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: -1;
        background: #fbfbfd;
        overflow: hidden;
    }
    
    .orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.5;
        animation: blob 20s infinite alternate;
    }
    .orb-1 { top: -10%; left: -10%; width: 60vw; height: 60vw; background: #E0F2FE; }
    .orb-2 { bottom: -20%; right: -10%; width: 60vw; height: 60vw; background: #FFEDD5; animation-delay: -5s; }
    .orb-3 { top: 40%; left: 40%; width: 40vw; height: 40vw; background: #F3E8FF; opacity: 0.4; animation-delay: -10s; }

    .bento-card {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);
        border: 1px solid rgba(255, 255, 255, 0.8);
        border-radius: 28px;
        box-shadow: 0 4px 24px -1px rgba(0, 0, 0, 0.04);
        transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
    }
    
    .bento-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 40px -4px rgba(0, 0, 0, 0.08);
        background: rgba(255, 255, 255, 0.85);
    }

    .twitter-card {
        background: #000 !important;
        border-color: transparent !important;
        color: #fff;
    }
    .twitter-card:hover {
        background: #1a1a1a !important;
    }

    .telegram-card {
        background: #0088cc !important;
        border-color: transparent !important;
        color: #fff;
    }
    .telegram-card:hover {
        background: #006fa1 !important;
    }

    .text-gradient {
        background: linear-gradient(135deg, #1d1d1f 0%, #434344 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }
    
    .text-gradient-blue {
        background: linear-gradient(135deg, #0071e3 0%, #42a5f5 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    ::-webkit-scrollbar { width: 0px; }
</style>

</head>
<body class="font-sans antialiased selection:bg-apple-blue selection:text-white pb-12">
رَبِّ إِنِّي لِمَا أَنزَلْتَ إِلَيَّ مِنْ خَيْرٍ فَقِيرٌ
</body>
</html>
